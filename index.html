<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicație Interactivă - Închinare & Acorduri</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #0d1117;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    video { display: none; }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .controls-overlay {
        position: absolute;
        top: 15px;
        z-index: 10;
        display: flex;
        gap: 10px;
        background: rgba(15, 23, 42, 0.9);
        padding: 10px 18px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        align-items: center;
    }

    select, button {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
    }

    /* ZONA KARAOKE / VERSURI */
    #lyricsBox {
        position: absolute;
        top: 80px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(103, 232, 249, 0.4);
        padding: 15px 25px;
        border-radius: 20px;
        text-align: center;
        max-width: 80%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #lyricLine {
        font-size: 22px;
        font-weight: bold;
        color: #f8fafc;
        margin-bottom: 8px;
    }

    #targetChordDisplay {
        font-size: 16px;
        color: #facc15;
        font-weight: bold;
    }

    .song-nav-btn {
        margin: 0 5px;
        padding: 4px 12px;
        font-size: 12px;
        background: #0284c7;
        border: none;
    }

    #statusMessage {
        position: absolute;
        bottom: 25px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.8);
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        color: #67e8f9;
        text-align: center;
        border: 1px solid rgba(103, 232, 249, 0.3);
    }
</style>
</head>
<body>

<div id="container">
    <video id="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <!-- Meniu de sus -->
    <div class="controls-overlay">
        <select id="songSelect">
            <option value="0">🎵 Cântă suflet al meu</option>
            <option value="1">🎵 Splendoare de împărat</option>
            <option value="2">🎵 Mă chemi să umblu peste ape</option>
        </select>

        <label style="font-size: 12px; font-weight: bold;">Gama:</label>
        <button id="transposeDownBtn"><b>-</b></button>
        <span id="transposeDisplay" style="font-size: 13px; font-weight: bold; color: #67e8f9;">0 ST</span>
        <button id="transposeUpBtn"><b>+</b></button>

        <select id="instrumentSelect">
            <option value="piano">🎹 Pian</option>
            <option value="guitar">🎸 Chitară</option>
            <option value="synth">🎛️ Sintezator</option>
        </select>

        <button id="startAudioBtn">▶️ Pornește</button>
    </div>

    <!-- Zonă Versuri & Ghidaj Acord Ghidat -->
    <div id="lyricsBox">
        <div id="lyricLine">Apasă 'Pornește' pentru a începe piesa</div>
        <div id="targetChordDisplay">
            <button class="song-nav-btn" id="prevLineBtn">◄ Înapoi</button>
            <span id="targetChordText">Acord recomandat: -</span>
            <button class="song-nav-btn" id="nextLineBtn">Înainte ►</button>
        </div>
    </div>

    <div id="statusMessage">Apasă pe butonul de sus pentru a porni camera...</div>
</div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusMessage = document.getElementById('statusMessage');
const startAudioBtn = document.getElementById('startAudioBtn');

let audioStarted = false;
let activeInstrument = 'piano';
let currentChordName = null;
let isProcessing = false;
let currentHandLandmarks = null;
let transposeSemiTones = 0;

// Rețetă de acorduri de bază
const baseChords = [
    { name: "Do (C)", root: "C4", notes: ["C4", "E4", "G4"] },
    { name: "Re m (Dm)", root: "D4", notes: ["D4", "F4", "A4"] },
    { name: "Mi m (Em)", root: "E4", notes: ["E4", "G4", "B4"] },
    { name: "Fa (F)", root: "F4", notes: ["F4", "A4", "C5"] },
    { name: "Sol (G)", root: "G4", notes: ["G4", "B4", "D5"] },
    { name: "La m (Am)", root: "A4", notes: ["A4", "C5", "E5"] },
    { name: "Si dim", root: "B4", notes: ["B4", "D5", "F5"] },
    { name: "Do high", root: "C5", notes: ["C5", "E5", "G5"] }
];

let activeChords = JSON.parse(JSON.stringify(baseChords));

// Catalogul de piese cu versuri și acorduri de ghidaj (indexate după poziția sectorului 0..7)
const songsDatabase = [
    {
        title: "Cântă suflet al meu",
        lines: [
            { text: "Cântă suflet al meu, pentru Domnul", targetIndex: 3 }, // Fa (F)
            { text: "Cântă suflet al meu!", targetIndex: 0 }, // Do (C)
            { text: "Numele Lui cel Sfânt laudă-L azi", targetIndex: 4 }, // Sol (G)
            { text: "Cântă ca niciodată, suflet al meu", targetIndex: 5 }, // La m (Am)
            { text: "O, nume-I înălțat!", targetIndex: 3 }  // Fa (F)
        ]
    },
    {
        title: "Splendoare de împărat",
        lines: [
            { text: "Splendoare de Împărat, îmbrăcat în maiestate", targetIndex: 0 }, // Do (C)
            { text: "Pământul va cânta, pământul va cânta!", targetIndex: 5 }, // La m (Am)
            { text: "El este îmbrăcat în lumină și har", targetIndex: 3 }, // Fa (F)
            { text: "Și întunericul va pieri din cale...", targetIndex: 4 }  // Sol (G)
        ]
    },
    {
        title: "Mă chemi să umblu peste ape",
        lines: [
            { text: "Mă chemi să umblu peste ape", targetIndex: 5 }, // La m (Am)
            { text: "Unde credința-mi poate cădea...", targetIndex: 4 }, // Sol (G)
            { text: "Acolo Te găsesc în taină", targetIndex: 3 }, // Fa (F)
            { text: "În ape adânci mă vei purta!", targetIndex: 0 }  // Do (C)
        ]
    }
];

let currentSongIndex = 0;
let currentLineIndex = 0;

// Reverb & Sintetizatoare
const reverb = new Tone.Reverb({ decay: 1.5, preDelay: 0.05 }).toDestination();
const instruments = {
    piano: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 1.2, sustain: 0.1, release: 1.2 } }).connect(reverb),
    guitar: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.8, sustain: 0.1, release: 0.8 } }).connect(reverb),
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 1 } }).toDestination()
};

// Transpunere Acorduri
function updateTranspose(st) {
    transposeSemiTones += st;
    document.getElementById('transposeDisplay').innerText = (transposeSemiTones >= 0 ? "+" : "") + transposeSemiTones + " ST";
    
    activeChords = baseChords.map(chord => {
        const transposedNotes = chord.notes.map(note => Tone.Frequency(note).transpose(transposeSemiTones).toNote());
        return { ...chord, notes: transposedNotes };
    });
}

document.getElementById('transposeUpBtn').addEventListener('click', () => updateTranspose(1));
document.getElementById('transposeDownBtn').addEventListener('click', () => updateTranspose(-1));

// Actualizare Versuri
function updateLyricsUI() {
    const song = songsDatabase[currentSongIndex];
    const line = song.lines[currentLineIndex];
    document.getElementById('lyricLine').innerText = line.text;
    const targetChordName = activeChords[line.targetIndex].name;
    document.getElementById('targetChordText').innerText = `Ghidaj Acord: ${targetChordName}`;
}

document.getElementById('songSelect').addEventListener('change', (e) => {
    currentSongIndex = parseInt(e.target.value);
    currentLineIndex = 0;
    updateLyricsUI();
});

document.getElementById('prevLineBtn').addEventListener('click', () => {
    if (currentLineIndex > 0) currentLineIndex--;
    updateLyricsUI();
});

document.getElementById('nextLineBtn').addEventListener('click', () => {
    const song = songsDatabase[currentSongIndex];
    if (currentLineIndex < song.lines.length - 1) currentLineIndex++;
    updateLyricsUI();
});

// Schimbare de pe tastatură (Săgeată Stânga/Dreapta)
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') document.getElementById('nextLineBtn').click();
    if (e.key === 'ArrowLeft') document.getElementById('prevLineBtn').click();
});

document.getElementById('instrumentSelect').addEventListener('change', (e) => {
    stopChord();
    activeInstrument = e.target.value;
});

function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function playChord(chord) {
    if (!audioStarted) return;
    if (currentChordName !== chord.name) {
        stopChord();
        const inst = instruments[activeInstrument];
        if (inst) inst.triggerAttack(chord.notes);
        currentChordName = chord.name;
        statusMessage.innerText = `Gamă Activă: ${chord.name}`;
    }
}

function stopChord() {
    if (!audioStarted) return;
    if (currentChordName !== null) {
        Object.keys(instruments).forEach(key => {
            try { instruments[key].releaseAll(); } catch(e){}
        });
        currentChordName = null;
        statusMessage.innerText = "Arată mâna spre cameră...";
    }
}

function processFingerPosition(x, y) {
    const centerX = canvasElement.width / 2;
    const centerY = canvasElement.height / 2;
    const outerRadius = Math.min(centerX, centerY) * 0.55;
    const innerRadius = 50;

    const dx = x - centerX;
    const dy = y - centerY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance >= innerRadius && distance <= outerRadius) {
        let angle = Math.atan2(dy, dx); 
        if (angle < 0) angle += 2 * Math.PI;

        const sliceAngle = (2 * Math.PI) / activeChords.length;
        const index = Math.floor(angle / sliceAngle);

        playChord(activeChords[index]);
        return index;
    } else {
        stopChord();
        return null;
    }
}

function drawChordWheel(activeSector) {
    const centerX = canvasElement.width / 2;
    const centerY = canvasElement.height / 2;
    const outerRadius = Math.min(centerX, centerY) * 0.55;
    const innerRadius = 50;
    const numSlices = activeChords.length;
    const sliceAngle = (2 * Math.PI) / numSlices;

    const currentSong = songsDatabase[currentSongIndex];
    const targetGuideSector = currentSong.lines[currentLineIndex].targetIndex;

    for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        canvasCtx.beginPath();
        canvasCtx.arc(centerX, centerY, outerRadius, startAngle, endAngle);
        canvasCtx.arc(centerX, centerY, innerRadius, endAngle, startAngle, true);
        canvasCtx.closePath();

        if (i === activeSector) {
            // Sector activat de mână (Albastru strălucitor)
            canvasCtx.fillStyle = 'rgba(103, 232, 249, 0.6)';
            canvasCtx.strokeStyle = '#67e8f9';
            canvasCtx.lineWidth = 4;
        } else if (i === targetGuideSector) {
            // Sector Ghidat de Cântare (Galben intens intermitent)
            canvasCtx.fillStyle = 'rgba(250, 204, 21, 0.45)';
            canvasCtx.strokeStyle = '#facc15';
            canvasCtx.lineWidth = 3;
        } else {
            canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            canvasCtx.lineWidth = 1;
        }

        canvasCtx.fill();
        canvasCtx.stroke();

        const midAngle = startAngle + sliceAngle / 2;
        const textRadius = (outerRadius + innerRadius) / 2;
        const textX = centerX + Math.cos(midAngle) * textRadius;
        const textY = centerY + Math.sin(midAngle) * textRadius;

        canvasCtx.save();
        canvasCtx.translate(textX, textY);
        canvasCtx.fillStyle = (i === activeSector || i === targetGuideSector) ? '#ffffff' : 'rgba(255, 255, 255, 0.75)';
        canvasCtx.font = 'bold 14px sans-serif';
        canvasCtx.textAlign = 'center';
        canvasCtx.textBaseline = 'middle';
        canvasCtx.fillText(activeChords[i].name, 0, 0);
        canvasCtx.restore();
    }

    canvasCtx.beginPath();
    canvasCtx.arc(centerX, centerY, innerRadius, 0, 2 * Math.PI);
    canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    canvasCtx.fill();
    canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    canvasCtx.stroke();
}

// MediaPipe Setup
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        currentHandLandmarks = results.multiHandLandmarks[0];
    } else {
        currentHandLandmarks = null;
    }
    isProcessing = false;
});

function drawLoop() {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    canvasCtx.translate(canvasElement.width, 0);
    canvasCtx.scale(-1, 1);
    if (videoElement.readyState >= 2) {
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
    }
    canvasCtx.restore();

    let activeSector = null;

    if (currentHandLandmarks) {
        const indexTip = currentHandLandmarks[8]; 
        const fingerX = (1 - indexTip.x) * canvasElement.width;
        const fingerY = indexTip.y * canvasElement.height;

        activeSector = processFingerPosition(fingerX, fingerY);

        canvasCtx.save();
        canvasCtx.beginPath();
        canvasCtx.arc(fingerX, fingerY, 12, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#67e8f9';
        canvasCtx.shadowColor = '#67e8f9';
        canvasCtx.shadowBlur = 15;
        canvasCtx.fill();
        canvasCtx.restore();
    } else {
        stopChord();
    }

    drawChordWheel(activeSector);

    if (!isProcessing && videoElement.readyState >= 2) {
        isProcessing = true;
        hands.send({ image: videoElement }).catch(() => { isProcessing = false; });
    }

    requestAnimationFrame(drawLoop);
}

async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false
    });
    videoElement.srcObject = stream;
    return new Promise((resolve) => {
        videoElement.onloadedmetadata = () => {
            videoElement.play();
            resolve();
        };
    });
}

startAudioBtn.addEventListener('click', async () => {
    try {
        statusMessage.innerText = "Se pornește sistemul...";
        await Tone.start();
        audioStarted = true;

        await setupCamera();
        startAudioBtn.style.display = 'none';
        statusMessage.innerText = "Aplicația este activă! Arată degetul spre cerc.";
        
        updateLyricsUI();
        drawLoop();
    } catch (err) {
        console.error(err);
        statusMessage.style.color = "#fca5a5";
        statusMessage.innerText = "Eroare la pornirea camerei!";
    }
});
</script>
</body>
</html>

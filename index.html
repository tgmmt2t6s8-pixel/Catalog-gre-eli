<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0b0f19">

<!-- Iconițe noi -->
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/musical-notes.png">
<link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/musical-notes.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repertoriu & Laudă">

<title>Repertoriu & Laudă</title>

<!-- Generare dinamică Manifest PWA pentru a suprascrie definitiv vechiul catalog -->
<script>
  const manifestData = {
    "name": "Repertoriu & Laudă",
    "short_name": "Repertoriu",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#0b0f19",
    "theme_color": "#0b0f19",
    "icons": [
      {
        "src": "https://img.icons8.com/fluency/192/musical-notes.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://img.icons8.com/fluency/512/musical-notes.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  };
  const stringManifest = JSON.stringify(manifestData);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.getElementsByTagName('head')[0].appendChild(link);
</script>

<style>
/* Permitem scroll-ul doar pe ecranul principal (body/html) */
html {
    background-color: #0b0f19;
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: none;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #ffffff;
    position: relative;
    min-height: 100%;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(rgba(11, 15, 25, 0.65), rgba(11, 15, 25, 0.95)), 
                url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1200&auto=format&fit=crop') center center / cover no-repeat;
    z-index: -1;
}

/* Stilizare Bara de Scroll direct pe marginea ecranului */
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(103, 232, 249, 0.5);
}

/* Suport Firefox */
html {
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
}

.main-content {
    max-width: 900px;
    margin: auto;
    padding: 12px;
    box-sizing: border-box;
}

h1 {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 10px 0 20px 0;
    letter-spacing: -0.5px;
    text-shadow: 0 0 10px rgba(103, 232, 249, 0.3);
}

h2 {
    font-size: 13px;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 14px;
    color: #67e8f9;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.tabel-playlisturi {
    width: 100%;
    margin-bottom: 4px;
}

.tabel-playlisturi td {
    border: none;
    padding: 6px;
    width: 50%;
    vertical-align: top;
}

.slot-cantec {
    background: rgba(103, 232, 249, 0.05);
    border: 1px dashed rgba(103, 232, 249, 0.25);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.slot-cantec.ocupat {
    background: rgba(103, 232, 249, 0.15);
    border: 1px solid #67e8f9;
}

.badge-gama {
    background: #67e8f9;
    color: #0b0f19;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    margin-left: 6px;
    text-transform: uppercase;
}

.btn-elimina-slot {
    background: transparent;
    border: none;
    color: #fca5a5;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
}

.bara-cautare-dubla {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

@media (max-width: 480px) {
    .bara-cautare-dubla {
        grid-template-columns: 1fr;
        gap: 8px;
    }
}

.header-sectiune {
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-sectiune h2 { margin: 0; }

.cauta-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    padding: 10px 12px;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 13.5px;
    font-weight: 600;
}
.cauta-input:focus {
    outline: none;
    border-color: #67e8f9;
    background: rgba(255, 255, 255, 0.1);
}

.lista-cantari {
    list-style: none;
    padding: 0;
    margin: 0;
}

.lista-cantari li {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.actiuni-inline-cantari {
    display: flex;
    gap: 6px;
    align-items: center;
}

.btn-inline {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: white;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.btn-inline.selecteaza { background: #67e8f9; color: #0b0f19; border: none; }
.btn-inline.resurse { background: rgba(2, 132, 199, 0.3); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
.btn-inline.resurse:hover { background: #0284c7; color: white; }
.btn-inline.sterge { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
</style>
</head>
<body>

<div class="main-content">
    <h1>🎶 Repertoriu & Laudă</h1>

    <div class="card">
        <h2>🗓️ Cântări Selectate pentru Azi (LIVE)</h2>
        <table class="tabel-playlisturi">
            <tr>
                <td>
                    <div style="font-size:12px; font-weight:700; color:#67e8f9; margin-bottom:8px; text-transform:uppercase;">🙏 Rugăciune (Max 10)</div>
                    <div id="playlistRugaciune"></div>
                </td>
                <td>
                    <div style="font-size:12px; font-weight:700; color:#67e8f9; margin-bottom:8px; text-transform:uppercase;">⛪ Program (Max 10)</div>
                    <div id="playlistProgram"></div>
                </td>
            </tr>
        </table>
    </div>

    <div class="bara-cautare-dubla">
        <input type="text" id="cautaRugaciune" class="cauta-input" placeholder="🔍 Caută în Rugăciune..." oninput="window.filtreazaCantari('rugaciune')">
        <input type="text" id="cautaProgram" class="cauta-input" placeholder="🔍 Caută în Program..." oninput="window.filtreazaCantari('program')">
    </div>

    <div class="card">
        <div class="header-sectiune">
            <h2>🙏 Toate de Rugăciune</h2>
            <button class="btn-inline" style="background:#fff; color:#0b0f19; font-size:13px; border:none;" onclick="window.adaugaCantare('rugaciune')">➕ Adaugă</button>
        </div>
        <ul id="listaRugaciune" class="lista-cantari"></ul>
    </div>

    <div class="card">
        <div class="header-sectiune">
            <h2>⛪ Toate de Program</h2>
            <button class="btn-inline" style="background:#fff; color:#0b0f19; font-size:13px; border:none;" onclick="window.adaugaCantare('program')">➕ Adaugă</button>
        </div>
        <ul id="listaProgram" class="lista-cantari"></ul>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKO99h9zibkcz2yD0Cn091yRWFgV9HLNA",
  authDomain: "catalog-absente.firebaseapp.com",
  projectId: "catalog-absente",
  storageBucket: "catalog-absente.appspot.com",
  messagingSenderId: "1042227111577",
  appId: "1:1042227111577:web:3d09dfb323420a5f5fba08"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectateRugaciune = [];
let selectateProgram = [];
let dateRugaciuneComplete = [];
let dateProgramComplete = [];

// Deschide direct căutarea versurilor & acordurilor pe Resurse Creștine
window.deschideResurse = function(titlu) {
    const url = `https://www.resursecrestine.ro/cautare?q=${encodeURIComponent(titlu)}`;
    window.open(url, '_blank');
}

onSnapshot(doc(db, "playlist_zi", "astazi"), (docSnap) => {
    if (docSnap.exists()) {
        const data = docSnap.data();
        selectateRugaciune = data.rugaciune || [];
        selectateProgram = data.program || [];
    } else {
        selectateRugaciune = [];
        selectateProgram = [];
    }
    randeazaPlaylisturiAzi();
});

window.trimiteInPlaylist = async function(titlu, gamaSalvata, categorie) {
    const titluriExistente = (categorie === 'rugaciune' ? selectateRugaciune : selectateProgram).map(x => x.titlu);
    
    if (categorie === 'rugaciune') {
        if (selectateRugaciune.length >= 10) return alert("Ai selectat deja maximul de 10 cântări la Rugăciune!");
        if (titluriExistente.includes(titlu)) return alert("Cântarea este deja adăugată!");
    } else {
        if (selectateProgram.length >= 10) return alert("Ai selectat deja maximul de 10 cântări la Program!");
        if (titluriExistente.includes(titlu)) return alert("Cântarea este deja adăugată!");
    }

    const obiectMelodie = { titlu: titlu, gama: gamaSalvata || "" };

    if (categorie === 'rugaciune') {
        selectateRugaciune.push(obiectMelodie);
    } else {
        selectateProgram.push(obiectMelodie);
    }
    
    try {
        await setDoc(doc(db, "playlist_zi", "astazi"), {
            rugaciune: selectateRugaciune,
            program: selectateProgram
        });
    } catch(e) { console.error(e); }
}

window.scoateSlot = async function(categorie, index) {
    if(categorie === 'rugaciune') selectateRugaciune.splice(index, 1);
    else selectateProgram.splice(index, 1);
    
    try {
        await setDoc(doc(db, "playlist_zi", "astazi"), {
            rugaciune: selectateRugaciune,
            program: selectateProgram
        });
    } catch(e) { console.error(e); }
}

function randeazaPlaylisturiAzi() {
    let htmlR = "";
    for(let i=0; i<10; i++){
        if(selectateRugaciune[i]) {
            let infoGama = selectateRugaciune[i].gama ? `<span class="badge-gama">${selectateRugaciune[i].gama}</span>` : '';
            let titluEscape = selectateRugaciune[i].titlu.replace(/'/g, "\\'");
            htmlR += `<div class="slot-cantec ocupat">
                <span>${selectateRugaciune[i].titlu} ${infoGama}</span>
                <div style="display:flex; gap:4px; align-items:center;">
                    <button class="btn-inline resurse" style="padding:2px 6px;" onclick="window.deschideResurse('${titluEscape}')">🔗</button>
                    <button class="btn-elimina-slot" onclick="window.scoateSlot('rugaciune', ${i})">×</button>
                </div>
            </div>`;
        } else {
            htmlR += `<div class="slot-cantec" style="opacity:0.4;"><span>Liber</span></div>`;
        }
    }
    document.getElementById("playlistRugaciune").innerHTML = htmlR;

    let htmlP = "";
    for(let i=0; i<10; i++){
        if(selectateProgram[i]) {
            let infoGama = selectateProgram[i].gama ? `<span class="badge-gama">${selectateProgram[i].gama}</span>` : '';
            let titluEscape = selectateProgram[i].titlu.replace(/'/g, "\\'");
            htmlP += `<div class="slot-cantec ocupat">
                <span>${selectateProgram[i].titlu} ${infoGama}</span>
                <div style="display:flex; gap:4px; align-items:center;">
                    <button class="btn-inline resurse" style="padding:2px 6px;" onclick="window.deschideResurse('${titluEscape}')">🔗</button>
                    <button class="btn-elimina-slot" onclick="window.scoateSlot('program', ${i})">×</button>
                </div>
            </div>`;
        } else {
            htmlP += `<div class="slot-cantec" style="opacity:0.4;"><span>Liber</span></div>`;
        }
    }
    document.getElementById("playlistProgram").innerHTML = htmlP;
}

window.filtreazaCantari = function(categorie) {
    const textCautat = document.getElementById(categorie === 'rugaciune' ? 'cautaRugaciune' : 'cautaProgram').value.toLowerCase();
    const dateSursa = categorie === 'rugaciune' ? dateRugaciuneComplete : dateProgramComplete;
    
    const filtrate = dateSursa.filter(m => m.titlu && m.titlu.toLowerCase().includes(textCautat));
    afiseazaInLista(filtrate, categorie);
}

function afiseazaInLista(vectorMelodii, categorie) {
    let html = "";
    vectorMelodii.forEach((m) => {
        let infoGama = m.gama ? `<span class="badge-gama">${m.gama}</span>` : '';
        let titluEscape = m.titlu.replace(/'/g, "\\'");
        html += `<li>
            <span>${m.titlu} ${infoGama}</span>
            <div class="actiuni-inline-cantari">
                <button class="btn-inline selecteaza" onclick="window.trimiteInPlaylist('${titluEscape}', '${(m.gama || "").replace(/'/g, "\\'")}', '${categorie}')">Alege</button>
                <button class="btn-inline resurse" onclick="window.deschideResurse('${titluEscape}')">🔗 Acorduri</button>
                <button class="btn-inline" onclick="window.editeazaGama('${m.id}', '${(m.gama || "").replace(/'/g, "\\'")}', '${categorie}')"># Gamă</button>
                <button class="btn-inline" onclick="window.editeazaCantare('${m.id}', '${titluEscape}', '${categorie}')">✏️</button>
                <button class="btn-inline sterge" onclick="window.stergeCantare('${m.id}', '${categorie}')">🗑️</button>
            </div>
        </li>`;
    });
    
    const containerId = categorie === 'rugaciune' ? 'listaRugaciune' : 'listaProgram';
    document.getElementById(containerId).innerHTML = html || `<p style="opacity:0.5; font-size:12px; padding:10px;">Nicio melodie găsită.</p>`;
}

window.adaugaCantare = async function(categorie) {
    let t = prompt("Numele melodiei noi:");
    if(!t || t.trim() === "") return;
    try { await addDoc(collection(db, `cantari_${categorie}`), { titlu: t.trim(), gama: "", creatLa: Date.now() }); } catch(e){ console.error(e); }
}

window.editeazaCantare = async function(id, titluVechi, categorie) {
    let t = prompt("Modifică numele melodiei:", titluVechi);
    if(!t || t.trim() === "" || t.trim() === titluVechi) return;
    try { await updateDoc(doc(db, `cantari_${categorie}`, id), { titlu: t.trim() }); } catch(e){ console.error(e); }
}

window.editeazaGama = async function(id, gamaVeche, categorie) {
    let g = prompt("Introdu sau modifică gama (ex: Do, Re, Mim, Lam):", gamaVeche);
    if(g === null) return;
    try { await updateDoc(doc(db, `cantari_${categorie}`, id), { gama: g.trim() }); } catch(e){ console.error(e); }
}

window.stergeCantare = async function(id, categorie) {
    if(confirm("Ștergi definitiv această melodie?")) {
        try { await deleteDoc(doc(db, `cantari_${categorie}`, id)); } catch(e){ console.error(e); }
    }
}

onSnapshot(collection(db, "cantari_rugaciune"), (snapshot) => {
    dateRugaciuneComplete = [];
    snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        if(d.titlu) {
            dateRugaciuneComplete.push({ id: docSnap.id, ...d });
        }
    });
    dateRugaciuneComplete.sort((a, b) => a.titlu.localeCompare(b.titlu));
    window.filtreazaCantari('rugaciune');
});

onSnapshot(collection(db, "cantari_program"), (snapshot) => {
    dateProgramComplete = [];
    snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        if(d.titlu) {
            dateProgramComplete.push({ id: docSnap.id, ...d });
        }
    });
    dateProgramComplete.sort((a, b) => a.titlu.localeCompare(b.titlu));
    window.filtreazaCantari('program');
});
</script>
</body>
</html>

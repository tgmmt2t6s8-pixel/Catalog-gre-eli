<title>Catalog Tineri PRO</title>
<style>
html, body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    height: 100%;
    background-color: #0b0f19;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #ffffff;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(rgba(11, 15, 25, 0.65), rgba(11, 15, 25, 0.95)), 
                url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1200&auto=format&fit=crop') center center / cover no-repeat;
    z-index: -1;
}

.nav-tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(15, 22, 38, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
}

.nav-tab {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 50%;
}

.nav-tab.active {
    color: #67e8f9;
}

.nav-tab svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

.tab-content {
    display: none;
    max-width: 900px;
    margin: auto;
    padding: 12px 12px 95px 12px;
    height: 100%;
    box-sizing: border-box;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.tab-content.active {
    display: block;
}

h1 {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 10px 0 20px 0;
    letter-spacing: -0.5px;
    text-shadow: 0 0 10px rgba(103, 232, 249, 0.3);
}

h2 {
    font-size: 13px;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 14px;
    color: #67e8f9;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.grid-nume {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.btn-nume {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border-radius: 14px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s;
}

.btn-nume:active {
    background: rgba(255, 255, 255, 0.15);
}

.avatar-foto {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    padding: 8px 4px;
    color: rgba(255, 255, 255, 0.4);
    font-size: 11px;
    text-transform: uppercase;
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    text-align: left;
}

td {
    padding: 12px 4px;
    font-size: 14px;
    font-weight: 700;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    text-align: left;
    vertical-align: middle;
}

.td-profil {
    display: flex;
    align-items: center;
    gap: 10px;
}

.nume-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
}

.badge-scor {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
}

.badge-scor.pericol {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    color: #fca5a5;
    box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
}

.tabel-playlisturi {
    width: 100%;
    margin-bottom: 4px;
}

.tabel-playlisturi td {
    border: none;
    padding: 6px;
    width: 50%;
    vertical-align: top;
}

.slot-cantec {
    background: rgba(103, 232, 249, 0.05);
    border: 1px dashed rgba(103, 232, 249, 0.25);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.slot-cantec.ocupat {
    background: rgba(103, 232, 249, 0.15);
    border: 1px solid #67e8f9;
}

.badge-gama {
    background: #67e8f9;
    color: #0b0f19;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    margin-left: 6px;
    text-transform: uppercase;
}

.btn-elimina-slot {
    background: transparent;
    border: none;
    color: #fca5a5;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
}

/* CONTAINERUL DE CĂUTARE DUBLĂ */
.bara-cautare-dubla {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

@media (max-width: 480px) {
    .bara-cautare-dubla {
        grid-template-columns: 1fr;
        gap: 8px;
    }
}

.header-sectiune {
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-sectiune h2 { margin: 0; }

.cauta-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    padding: 10px 12px;
    border-radius: 10px;

    font-size: 13.5px;
    font-weight: 600;
}
.cauta-input:focus {
    outline: none;
    border-color: #67e8f9;
    background: rgba(255, 255, 255, 0.1);
}

.lista-cantari {
    list-style: none;
    padding: 0;
    margin: 0;
}

.lista-cantari li {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.actiuni-inline-cantari {
    display: flex;
    gap: 6px;
}

.btn-inline {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: white;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}
.btn-inline.selecteaza { background: #67e8f9; color: #0b0f19; border: none; }
.btn-inline.sterge { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

.verset-box {
    font-size: 12px;

    color: #67e8f9;
    font-style: italic;
    background: rgba(0, 0, 0, 0.35);

    border-left: 3px solid #67e8f9;
    border-radius: 6px;
    margin-top: 6px;
    line-height: 1.4;
}
.btn-admin { background: transparent; border: 1px dashed rgba(255, 255, 255, 0.2); color: white; padding: 10px; width: 100%; border-radius: 10px; font-weight: 600; font-size: 13px; }
#deleteOptions { display: none; margin-top: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
.check-del { display: block; margin: 6px 0; font-size: 13.5px; }
.btn-confirm-del { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; margin-top: 8px; }
</style>
</head>

<script>
  function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKO99h9zibkcz2yD0Cn091yRWFgV9HLNA",
  authDomain: "catalog-absente.firebaseapp.com",
  projectId: "catalog-absente",
  storageBucket: "catalog-absente.appspot.com",
  messagingSenderId: "1042227111577",
  appId: "1:1042227111577:web:3d09dfb323420a5f5fba08"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const verseteMembri = {
  "Felix": "„Pune, Doamne, o strajă înaintea gurii mele, şi păzeşte uşa buzelor mele!” – Psalmul 141:3",
  "Diana": "„Fii o pildă pentru credincioşi: în vorbire, în purtare, în dragoste, în credinţă, în curăţie.” – 1 Timotei 4:12",
  "Federico": "„Cine este chibzuit la vorbă stăpâneşte o ştiinţă adevărată, şi cine are duhul potolit este un om priceput.” – Proverbe 17:27",
  "Giorgio": "„Un răspuns blând potoleşte mânia, dar o vorbă aspră aţâţă mânia.” – Proverbe 15:1",
  "Sara": "„Învăţaţi de la Mine, căci Eu sunt blând şi smerit cu inima; şi veţi găsi odihnă pentru sufletele voastre.” – Matei 11:29",
  "Debora": "„Toate lucrurile să se facă în chip cuviincios şi cu rânduială.” – 1 Corinteni 14:40"
};

let selectateRugaciune = [];
let selectateProgram = [];
let dateRugaciuneComplete = [];
let dateProgramComplete = [];

window.adauga = async function(nume){
  try {
    const ref = doc(db,"puncte",nume);
    const snap = await getDoc(ref);
    let puncte = snap.exists() ? snap.data().puncte : 0;
    let noi = puncte + 1;
    await setDoc(ref,{ puncte: noi, ultimaModificare: Date.now() });
    if(noi === 4) alert(`⚠️ ${nume} a atins pragul de 4 puncte!\nVerset: ${verseteMembri[nume]}`);
  } catch(e) { console.error(e); }
}

window.showDeleteOptions = function(){ 
    const el = document.getElementById("deleteOptions");
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

document.getElementById("btnConfirmareReset").onclick = async function(){
  try {
    const selectate = document.querySelectorAll('#deleteOptions input:checked');
    for(const persoana of selectate){ await deleteDoc(doc(db,"puncte",persoana.value)); }
    selectate.forEach(x=>x.checked=false);
    document.getElementById("deleteOptions").style.display = "none";
    alert("Resetat cu succes.");
  } catch(e) { console.error(e); }
}

onSnapshot(collection(db,"puncte"), (snapshot)=>{
  let html="";
  snapshot.forEach((docSnap)=>{ 
    const date = docSnap.data();
    const nume = docSnap.id;
    const afiseazaVerset = date.puncte >= 4;
    const pozaUrl = `./${nume.toLowerCase()}.jpeg?v=1`;
    
    html += `<tr>
      <td>
        <div class="td-profil">
          <img src="${pozaUrl}" class="avatar-foto" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ffffff\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z\'/></svg>'">
          <div class="nume-container">
            <div style="font-size: 15px;">${nume}</div>
            ${afiseazaVerset ? `<div class="verset-box">📖 ${verseteMembri[nume]}</div>` : ''}
          </div>
        </div>
      </td>
      <td style="text-align: right;"><span class="badge-scor ${afiseazaVerset ? 'pericol' : ''}">${date.puncte} puncte</span></td>
    </tr>`; 
  });
  document.getElementById("tableBody").innerHTML = html;
});

// --- REPERTORIU & PLAYLIST LIVE CU GAMA ---

onSnapshot(doc(db, "playlist_zi", "astazi"), (docSnap) => {
    if (docSnap.exists()) {
        const data = docSnap.data();
        selectateRugaciune = data.rugaciune || [];
        selectateProgram = data.program || [];
    } else {
        selectateRugaciune = [];
        selectateProgram = [];
    }
    randeazaPlaylisturiAzi();
});

window.trimiteInPlaylist = async function(titlu, categorie) {
    const titluriExistente = (categorie === 'rugaciune' ? selectateRugaciune : selectateProgram).map(x => x.titlu);
    
    if (categorie === 'rugaciune') {
        if (selectateRugaciune.length >= 4) return alert("Ai selectat deja maximul de 4 cântări la Rugăciune!");
        if (titluriExistente.includes(titlu)) return alert("Cântarea este deja adăugată!");
    } else {
        if (selectateProgram.length >= 4) return alert("Ai selectat deja maximul de 4 cântări la Program!");
        if (titluriExistente.includes(titlu)) return alert("Cântarea este deja adăugată!");
    }
    
    let gama = prompt(`Introdu gama pentru melodia „${titlu}” (ex: Do, Re, Mim, Lam) sau lasă gol dacă nu se știe:`);
    if (gama === null) return; 
    gama = gama.trim() === "" ? "" : gama.trim();

    const obiectMelodie = { titlu: titlu, gama: gama };

    if (categorie === 'rugaciune') {
        selectateRugaciune.push(obiectMelodie);
    } else {
        selectateProgram.push(obiectMelodie);
    }
    
    try {
        await setDoc(doc(db, "playlist_zi", "astazi"), {
            rugaciune: selectateRugaciune,
            program: selectateProgram
        });
    } catch(e) { console.error(e); }
}

window.scoateSlot = async function(categorie, index) {
    if(categorie === 'rugaciune') selectateRugaciune.splice(index, 1);
    else selectateProgram.splice(index, 1);
    
    try {
        await setDoc(doc(db, "playlist_zi", "astazi"), {
            rugaciune: selectateRugaciune,
            program: selectateProgram
        });
    } catch(e) { console.error(e); }
}

function randeazaPlaylisturiAzi() {
    let htmlR = "";
    for(let i=0; i<4; i++){
        if(selectateRugaciune[i]) {
            let infoGama = selectateRugaciune[i].gama ? `<span class="badge-gama">${selectateRugaciune[i].gama}</span>` : '';
            htmlR += `<div class="slot-cantec ocupat"><span>${selectateRugaciune[i].titlu} ${infoGama}</span><button class="btn-elimina-slot" onclick="window.scoateSlot('rugaciune', ${i})">×</button></div>`;
        } else {
            htmlR += `<div class="slot-cantec" style="opacity:0.4;"><span>Liber</span></div>`;
        }
    }
    document.getElementById("playlistRugaciune").innerHTML = htmlR;

    let htmlP = "";
    for(let i=0; i<4; i++){
        if(selectateProgram[i]) {
            let infoGama = selectateProgram[i].gama ? `<span class="badge-gama">${selectateProgram[i].gama}</span>` : '';
            htmlP += `<div class="slot-cantec ocupat"><span>${selectateProgram[i].titlu} ${infoGama}</span><button class="btn-elimina-slot" onclick="window.scoateSlot('program', ${i})">×</button></div>`;
        } else {
            htmlP += `<div class="slot-cantec" style="opacity:0.4;"><span>Liber</span></div>`;
        }
    }
    document.getElementById("playlistProgram").innerHTML = htmlP;
}

window.filtreazaCantari = function(categorie) {
    const textCautat = document.getElementById(categorie === 'rugaciune' ? 'cautaRugaciune' : 'cautaProgram').value.toLowerCase();
    const dateSursa = categorie === 'rugaciune' ? dateRugaciuneComplete : dateProgramComplete;
    
    const filtrate = dateSursa.filter(m => m.titlu && m.titlu.toLowerCase().includes(textCautat));
    afiseazaInLista(filtrate, categorie);
}

function afiseazaInLista(vectorMelodii, categorie) {
    let html = "";
    vectorMelodii.forEach((m) => {
        html += `<li>
            <span>${m.titlu}</span>
            <div class="actiuni-inline-cantari">
                <button class="btn-inline selecteaza" onclick="window.trimiteInPlaylist('${m.titlu.replace(/'/g, "\\'")}', '${categorie}')">Alege</button>
                <button class="btn-inline" onclick="window.editeazaCantare('${m.id}', '${m.titlu.replace(/'/g, "\\'")}', '${categorie}')">✏️</button>
                <button class="btn-inline sterge" onclick="window.stergeCantare('${m.id}', '${categorie}')">🗑️</button>
            </div>
        </li>`;
    });
    
    const containerId = categorie === 'rugaciune' ? 'listaRugaciune' : 'listaProgram';
    document.getElementById(containerId).innerHTML = html || `<p style="opacity:0.5; font-size:12px; padding:10px;">Nicio melodie găsită.</p>`;
}

window.adaugaCantare = async function(categorie) {
    let t = prompt("Numele melodiei noi:");
    if(!t || t.trim() === "") return;
    try { await addDoc(collection(db, `cantari_${categorie}`), { titlu: t.trim(), creatLa: Date.now() }); } catch(e){ console.error(e); }
}

window.editeazaCantare = async function(id, titluVechi, categorie) {
    let t = prompt("Modifică numele melodiei:", titluVechi);
    if(!t || t.trim() === "" || t.trim() === titluVechi) return;
    try { await updateDoc(doc(db, `cantari_${categorie}`, id), { titlu: t.trim() }); } catch(e){ console.error(e); }
}

window.stergeCantare = async function(id, categorie) {
    if(confirm("Ștergi definitiv această melodie?")) {
        try { await deleteDoc(doc(db, `cantari_${categorie}`, id)); } catch(e){ console.error(e); }
    }
}

// Încarcă melodiile din baza de date și le sortează alfabetic nativ
onSnapshot(collection(db, "cantari_rugaciune"), (snapshot) => {
    dateRugaciuneComplete = [];
    snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        if(d.titlu) {
            dateRugaciuneComplete.push({ id: docSnap.id, ...d });
        }
    });
    dateRugaciuneComplete.sort((a, b) => a.titlu.localeCompare(b.titlu));
    window.filtreazaCantari('rugaciune');
});

onSnapshot(collection(db, "cantari_program"), (snapshot) => {
    dateProgramComplete = [];
    snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        if(d.titlu) {
            dateProgramComplete.push({ id: docSnap.id, ...d });
        }
    });
    dateProgramComplete.sort((a, b) => a.titlu.localeCompare(b.titlu));
    window.filtreazaCantari('program');
});
</script>

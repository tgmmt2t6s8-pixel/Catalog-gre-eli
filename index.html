<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json?v=42">
<meta name="theme-color" content="#090b11">
<link class="apple-touch-icon" href="icon-192.png?v=42">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catalog Tineri">

<title>Catalog Tineri PRO</title>
<style>
html, body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    height: 100%;
    background-color: #090b11;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #ffffff;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(rgba(9, 11, 17, 0.6), rgba(9, 11, 17, 0.95)), 
                url('https://images.unsplash.com/photo-1545128485-c400e7702796?q=80&w=1000&auto=format&fit=crop') center center / cover no-repeat;
    z-index: -1;
}

.nav-tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(15, 20, 32, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
}

.nav-tab {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 50%;
}

.nav-tab.active {
    color: #67e8f9;
}

.nav-tab svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

.tab-content {
    display: none;
    max-width: 900px;
    margin: auto;
    padding: 12px 12px 95px 12px;
    height: 100%;
    box-sizing: border-box;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.tab-content.active {
    display: block;
}

h1 {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 10px 0 20px 0;
    letter-spacing: -0.5px;
}

h2 {
    font-size: 13px;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 14px;
    color: #67e8f9;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.12); 
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-sizing: border-box;
}

.grid-nume {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.btn-nume {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border-radius: 14px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    padding: 8px 4px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
    text-transform: uppercase;
    border-bottom: 2px solid rgba(255, 255, 255, 0.12);
    text-align: left;
}

td {
    padding: 12px 4px;
    font-size: 14px;
    font-weight: 700;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    text-align: left;
    vertical-align: top;
}

.td-profil {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.avatar-tabel {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
}

.nume-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
}

.badge-scor {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
}

.badge-scor.pericol {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    color: #fca5a5;
}

.verset-box {
    font-size: 12px;
    font-weight: 500;
    color: #67e8f9;
    font-style: italic;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 10px;
    border-left: 3px solid #67e8f9;
    border-radius: 6px;
    line-height: 1.4;
    margin-top: 6px;
}

.zona-alegere-azi {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 16px;
}

@media(min-width: 768px) {
    .zona-alegere-azi { grid-template-columns: repeat(2, 1fr); }
}

.slot-cantec {
    background: rgba(103, 232, 249, 0.06);
    border: 1px dashed rgba(103, 232, 249, 0.3);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.slot-cantec.ocupat {
    background: rgba(103, 232, 249, 0.15);
    border: 1px solid #67e8f9;
}

.btn-elimina-slot {
    background: transparent;
    border: none;
    color: #fca5a5;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
}

.container-cantari-paralel {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

@media (min-width: 768px) {
    .container-cantari-paralel { grid-template-columns: repeat(2, 1fr); }
}

.header-sectiune {
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-sectiune h2 { margin: 0; }

.controale-sectiune {
    display: flex;
    gap: 5px;
}

.btn-actiune {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.lista-cantari {
    list-style: none;
    padding: 0;
    margin: 0;
}

.lista-cantari li {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 11px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.btn-item-op {
    background: transparent;
    border: none;
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
}

.btn-admin { background: transparent; border: 1px dashed rgba(255, 255, 255, 0.2); color: white; padding: 10px; width: 100%; border-radius: 10px; font-weight: 600; font-size: 13px; }
#deleteOptions { display: none; margin-top: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
.check-del { display: block; margin: 6px 0; font-size: 13.5px; }
.btn-confirm-del { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>

<nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('catalog-tab', this)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm0 8H7v-2h10v2z"/></svg>
        <span>Catalog Tineri</span>
    </button>
    <button class="nav-tab" onclick="switchTab('cantari-tab', this)">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>Repertoriu Biserică</span>
    </button>
</nav>

<div id="catalog-tab" class="tab-content active">
    <h1>📊 Catalog Tineri</h1>
    
    <div class="card">
        <h2>➕ Adaugă Punct</h2>
        <div class="grid-nume">
            <button class="btn-nume" onclick="window.adauga('Felix')">Felix</button>
            <button class="btn-nume" onclick="window.adauga('Diana')">Diana</button>
            <button class="btn-nume" onclick="window.adauga('Federico')">Federico</button>
            <button class="btn-nume" onclick="window.adauga('Giorgio')">Giorgio</button>
            <button class="btn-nume" onclick="window.adauga('Sara')">Sara</button>
            <button class="btn-nume" onclick="window.adauga('Debora')">Debora</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Situație Penalizări</h2>
        <table>
            <thead>
                <tr>
                    <th style="width: 75%;">Membru</th>
                    <th style="text-align: right; width: 25%;">Scor</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>⚙️ Resetare Scoruri</h2>
        <button class="btn-admin" onclick="window.showDeleteOptions()">Deschide Opțiuni Resetare</button>
        <div id="deleteOptions">
            <label class="check-del"><input type="checkbox" value="Felix"> Felix</label>
            <label class="check-del"><input type="checkbox" value="Diana"> Diana</label>
            <label class="check-del"><input type="checkbox" value="Federico"> Federico</label>
            <label class="check-del"><input type="checkbox" value="Giorgio"> Giorgio</label>
            <label class="check-del"><input type="checkbox" value="Sara"> Sara</label>
            <label class="check-del"><input type="checkbox" value="Debora"> Debora</label>
            <button id="btnConfirmareReset" class="btn-confirm-del">Resetează Selectați</button>
        </div>
    </div>
</div>

<div id="cantari-tab" class="tab-content">
    <h1>🎵 Playlist & Repertoriu</h1>

    <div class="zona-alegere-azi">
        <div class="card">
            <h2>🙏 La Rugăciune (Max 4 pentru Azi)</h2>
            <div id="playlistRugaciune"></div>
        </div>
        <div class="card">
            <h2>⛪ La Program (Max 4 pentru Azi)</h2>
            <div id="playlistProgram"></div>
        </div>
    </div>

    <div class="container-cantari-paralel">
        <div class="card">
            <div class="header-sect

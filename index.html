<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicație Cântări & Ghidaj Acorduri</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        max-width: 800px;
        width: 100%;
        background: #1e293b;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
        text-align: center;
        color: #38bdf8;
        margin-top: 0;
    }

    /* BARA DE CONTROL: Melodie, Transpunere, Instrument */
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-between;
        align-items: center;
        background: #0f172a;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 25px;
    }

    select, button {
        background: #334155;
        color: white;
        border: 1px solid #475569;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
    }

    button:hover { background: #475569; }

    .transpose-box {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .transpose-val {
        color: #38bdf8;
        font-weight: bold;
        min-width: 45px;
        text-align: center;
    }

    /* ZONA AFISARE VERSURI SI ACORDURI */
    .song-display {
        background: #0f172a;
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #334155;
    }

    .song-title {
        font-size: 22px;
        color: #facc15;
        margin-bottom: 15px;
        text-align: center;
    }

    .verse-block {
        margin-bottom: 20px;
        line-height: 1.8;
    }

    .line {
        margin-bottom: 10px;
        font-size: 18px;
    }

    /* Stilul acordurilor */
    .chord {
        display: inline-block;
        font-weight: bold;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.15);
        padding: 2px 8px;
        border-radius: 6px;
        margin: 0 4px;
        cursor: pointer;
        border: 1px solid rgba(56, 189, 248, 0.3);
        transition: all 0.2s;
    }

    .chord:hover {
        background: #38bdf8;
        color: #0f172a;
    }

    .audio-notice {
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
        margin-top: 15px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🎶 Melodii & Acorduri Interactive</h1>

    <!-- Controls -->
    <div class="controls">
        <div>
            <label style="font-size: 12px; color: #94a3b8; display:block;">Selectează piesa:</label>
            <select id="songSelect"></select>
        </div>

        <div class="transpose-box">
            <label style="font-size: 12px; color: #94a3b8; display:block; width:100%;">Transpunere (Gama):</label>
            <button id="downBtn"><b>-</b></button>
            <span class="transpose-val" id="transposeDisplay">0 ST</span>
            <button id="upBtn"><b>+</b></button>
        </div>

        <div>
            <label style="font-size: 12px; color: #94a3b8; display:block;">Instrument:</label>
            <select id="instSelect">
                <option value="piano">🎹 Pian</option>
                <option value="guitar">🎸 Chitară</option>
                <option value="synth">🎛️ Sintezator</option>
            </select>
        </div>
    </div>

    <!-- Zonă Redare Piesa -->
    <div class="song-display">
        <div class="song-title" id="songTitle">Se încarcă...</div>
        <div id="lyricsContent"></div>
    </div>

    <div class="audio-notice">💡 Apasă pe orice acord evidențiat (ex: [ C ]) pentru a-l auzi cântat!</div>
</div>

<script>
// Catalogul cu melodiile tale
const songs = [
    {
        title: "Cântă suflet al meu",
        lyrics: [
            { text: "Cântă suflet al meu, pentru Domnul", chords: [{ pos: 0, note: "F" }] },
            { text: "Cântă suflet al meu!", chords: [{ pos: 0, note: "C" }] },
            { text: "Numele Lui cel Sfânt laudă-L azi", chords: [{ pos: 0, note: "G" }] },
            { text: "Cântă ca niciodată, suflet al meu", chords: [{ pos: 0, note: "Am" }] },
            { text: "O, nume-I înălțat!", chords: [{ pos: 0, note: "F" }] }
        ]
    },
    {
        title: "Splendoare de împărat",
        lyrics: [
            { text: "Splendoare de Împărat, îmbrăcat în maiestate", chords: [{ pos: 0, note: "C" }] },
            { text: "Pământul va cânta, pământul va cânta!", chords: [{ pos: 0, note: "Am" }] },
            { text: "El este îmbrăcat în lumină și har", chords: [{ pos: 0, note: "F" }] },
            { text: "Și întunericul va pieri din cale...", chords: [{ pos: 0, note: "G" }] }
        ]
    },
    {
        title: "Mă chemi să umblu peste ape",
        lyrics: [
            { text: "Mă chemi să umblu peste ape", chords: [{ pos: 0, note: "Am" }] },
            { text: "Unde credința-mi poate cădea...", chords: [{ pos: 0, note: "G" }] },
            { text: "Acolo Te găsesc în taină", chords: [{ pos: 0, note: "F" }] },
            { text: "În ape adânci mă vei purta!", chords: [{ pos: 0, note: "C" }] }
        ]
    },
    {
        title: "Destinul tău e să învingi",
        lyrics: [
            { text: "Nu te uita la valul greu ce vine", chords: [{ pos: 0, note: "C" }] },
            { text: "Încrede-te în Domnul, El e cu tine!", chords: [{ pos: 0, note: "G" }] },
            { text: "Destinul tău e să învingi mereu", chords: [{ pos: 0, note: "Am" }, { pos: 25, note: "F" }] }
        ]
    }
];

// Note de bază pentru sinteză audio
const chordNotesMap = {
    "C": ["C4", "E4", "G4"],
    "Dm": ["D4", "F4", "A4"],
    "Em": ["E4", "G4", "B4"],
    "F": ["F4", "A4", "C5"],
    "G": ["G4", "B4", "D5"],
    "Am": ["A4", "C5", "E5"]
};

const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

let currentSongIdx = 0;
let transposeSteps = 0;
let audioStarted = false;

// Inițializare Audio Tone.js
const reverb = new Tone.Reverb(1.5).toDestination();
const synth = new Tone.PolySynth(Tone.Synth).connect(reverb);

function playChordAudio(chordName) {
    Tone.start();
    // Transpunem acordul și audio
    let base = chordName.replace("m", "");
    let isMinor = chordName.includes("m");
    
    let baseIdx = noteNames.indexOf(base);
    if (baseIdx !== -1) {
        let newIdx = (baseIdx + transposeSteps) % 12;
        if (newIdx < 0) newIdx += 12;
        let rootNote = noteNames[newIdx] + "4";
        
        let notes = isMinor ? 
            [rootNote, Tone.Frequency(rootNote).transpose(3).toNote(), Tone.Frequency(rootNote).transpose(7).toNote()] :
            [rootNote, Tone.Frequency(rootNote).transpose(4).toNote(), Tone.Frequency(rootNote).transpose(7).toNote()];
            
        synth.triggerAttackRelease(notes, "1n");
    }
}

// Transpunere Acorduri în Text
function transposeChordText(chord, steps) {
    let isMinor = chord.endsWith("m");
    let root = isMinor ? chord.slice(0, -1) : chord;
    let idx = noteNames.indexOf(root);
    if (idx === -1) return chord;
    
    let transposedIdx = (idx + steps) % 12;
    if (transposedIdx < 0) transposedIdx += 12;
    
    return noteNames[transposedIdx] + (isMinor ? "m" : "");
}

function renderSong() {
    const song = songs[currentSongIdx];
    document.getElementById("songTitle").innerText = song.title;
    const container = document.getElementById("lyricsContent");
    container.innerHTML = "";

    song.lyrics.forEach(lineObj => {
        const lineDiv = document.createElement("div");
        lineDiv.className = "line";

        let chordSpan = "";
        lineObj.chords.forEach(c => {
            let transposed = transposeChordText(c.note, transposeSteps);
            chordSpan += `<span class="chord" onclick="playChordAudio('${c.note}')">[ ${transposed} ]</span>`;
        });

        lineDiv.innerHTML = `${chordSpan} ${lineObj.text}`;
        container.appendChild(lineDiv);
    });
}

// Event Listeners
const songSelect = document.getElementById("songSelect");
songs.forEach((song, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.innerText = song.title;
    songSelect.appendChild(opt);
});

songSelect.addEventListener("change", (e) => {
    currentSongIdx = parseInt(e.target.value);
    renderSong();
});

document.getElementById("upBtn").addEventListener("click", () => {
    transposeSteps++;
    document.getElementById("transposeDisplay").innerText = (transposeSteps >= 0 ? "+" : "") + transposeSteps + " ST";
    renderSong();
});

document.getElementById("downBtn").addEventListener("click", () => {
    transposeSteps--;
    document.getElementById("transposeDisplay").innerText = (transposeSteps >= 0 ? "+" : "") + transposeSteps + " ST";
    renderSong();
});

// Pornire inițială
renderSong();
</script>
</body>
</html>

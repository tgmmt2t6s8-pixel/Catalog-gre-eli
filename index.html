<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Melodii Biserică & Resurse Creștine</title>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        max-width: 700px;
        width: 100%;
        background: #1e293b;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
        text-align: center;
        color: #38bdf8;
        margin-top: 0;
        margin-bottom: 20px;
    }

    /* Cautare */
    .search-box {
        width: 100%;
        margin-bottom: 20px;
    }

    .search-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
    }

    .search-input:focus {
        border-color: #38bdf8;
    }

    /* Lista de melodii */
    .song-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 5px;
    }

    .song-card {
        background: #0f172a;
        padding: 14px 18px;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #334155;
        transition: transform 0.1s ease, border-color 0.2s;
    }

    .song-card:hover {
        border-color: #38bdf8;
    }

    .song-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .song-title {
        font-size: 17px;
        font-weight: bold;
        color: #f8fafc;
    }

    .song-tag {
        font-size: 12px;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.05);
        padding: 2px 8px;
        border-radius: 4px;
        width: fit-content;
    }

    /* Buton Resurse Crestine */
    .btn-resurse {
        background-color: #0284c7;
        color: white;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 0.2s;
        border: none;
        cursor: pointer;
    }

    .btn-resurse:hover {
        background-color: #0369a1;
    }

    /* Scrollbar personalizat */
    .song-list::-webkit-scrollbar {
        width: 6px;
    }
    .song-list::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
    }
</style>
</head>
<body>

const songListElement = document.getElementById('songList');
const searchInput = document.getElementById('searchInput');

// Funcție care deschide căutarea pe Resurse Creștine
function deschideResurseCrestine(titlu) {
    const url = `https://www.resursecrestine.ro/cautare?q=${encodeURIComponent(titlu)}`;
    window.open(url, '_blank');
}

// Afișează melodiile în interfață
function afiseazaCantari(lista) {
    songListElement.innerHTML = '';
    
    lista.forEach(cantare => {
        const card = document.createElement('div');
        card.className = 'song-card';
        
        card.innerHTML = `
            <div class="song-info">
                <div class="song-title">${cantare.titlu}</div>
                <div class="song-tag">${cantare.tip}</div>
            </div>
            <button class="btn-resurse" onclick="deschideResurseCrestine('${cantare.titlu}')">
                🔗 Vezi Versuri & Acorduri
            </button>
        `;
        
        songListElement.appendChild(card);
    });
}

// Filtrare căutare în timp real
searchInput.addEventListener('input', (e) => {
    const textCautat = e.target.value.toLowerCase();
    const rezultate = cantari.filter(c => c.titlu.toLowerCase().includes(textCautat));
    afiseazaCantari(rezultate);
});

// Inițializare
